<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PlayGo Admin CMS · Panel Operasional &amp; Monitoring</title>
    <link rel="icon" type="image/jpeg" href="/playgo-logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    />
    <script>
      (function () {
        var pref = 'dark';
        try {
          pref = localStorage.getItem('playgo_admin_theme') || 'dark';
        } catch (e) {}
        if (pref !== 'light' && pref !== 'dark') pref = 'dark';
        document.documentElement.dataset.adminTheme = pref;
      })();
    </script>
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/client/src/admin/main.jsx"></script>
  </body>
</html>
