services:
  postgres:
    image: postgres:17-alpine
    container_name: jakludo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-jakludo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jakludo_secret}
      - POSTGRES_DB=${POSTGRES_DB:-jakludo}
    # Dioptimalkan agar hemat RAM saat berjalan berdampingan dengan layanan lain di server yang sama
    command: >
      postgres -c shared_buffers=64MB -c work_mem=4MB -c maintenance_work_mem=32MB -c max_connections=50
    ports:
      # Dipetakan ke 127.0.0.1:5433 di host agar tidak bentrok dengan port 5432 milik PostgreSQL lain di server
      # Jika perlu akses Navicat lewat IP Tailscale/LAN, isi POSTGRES_BIND_IP=100.x.x.x di .env
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - jakludo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jakludo} -d $${POSTGRES_DB:-jakludo}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jakludo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jakludo-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-5172}:5172"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5172
      # Isi 1 jika diakses lewat Nginx reverse proxy agar rate limit login memakai IP asli pemain
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # Koneksi ke container postgres menggunakan variabel terpisah (aman untuk karakter spesial apa pun di password)
      - PGHOST=${PGHOST:-postgres}
      - PGPORT=${PGPORT:-5432}
      - PGUSER=${POSTGRES_USER:-jakludo}
      - PGPASSWORD=${POSTGRES_PASSWORD:-jakludo_secret}
      - PGDATABASE=${POSTGRES_DB:-jakludo}
      - PGSSLMODE=${PGSSLMODE:-}
      # Konfigurasi MinIO / S3 Object Storage untuk media grup (foto & voice note)
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-jakludo}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - S3_PRESIGN_TTL_SEC=${S3_PRESIGN_TTL_SEC:-600}
      # Otomatis terhubung ke container postgres di jaringan internal Docker (bebas bentrok port host)
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-jakludo}:${POSTGRES_PASSWORD:-jakludo_secret}@postgres:5432/${POSTGRES_DB:-jakludo}}
      - PGSSLMODE=${PGSSLMODE:-}
      # Google OAuth 2.0 (Sign-In with Google)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Duitku Payment Gateway (POP)
      - DUITKU_MERCHANT_CODE=${DUITKU_MERCHANT_CODE:-}
      - DUITKU_API_KEY=${DUITKU_API_KEY:-}
      - DUITKU_IS_PRODUCTION=${DUITKU_IS_PRODUCTION:-0}
      - DUITKU_CALLBACK_URL=${DUITKU_CALLBACK_URL:-}
      # Google reCAPTCHA v3
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE:-0.5}
    volumes:
      # Folder data lokal tetap di-mount agar saat pertama kali deploy dengan PostgreSQL,
      # file jakludo.db lama otomatis dimigrasikan ke PostgreSQL dan hasil backup tersimpan di host.
      - ./server/data:/app/server/data
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5172/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jakludo_pgdata:
